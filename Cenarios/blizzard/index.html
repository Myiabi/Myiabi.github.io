<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Final Battle - The Ice Emperor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body oncontextmenu="return false;">
    <!-- CENÁRIO: Elementos visuais do ambiente -->
    <div class="clouds-bg"></div>
    <canvas id="snow-canvas-1"></canvas>
    <canvas id="snow-canvas-2"></canvas>
    <canvas id="snow-canvas-3"></canvas>
    <canvas id="snow-canvas-4"></canvas>
    <canvas id="snow-canvas-5"></canvas>
    <canvas id="snow-canvas-6"></canvas>
    <canvas id="star-canvas"></canvas>

    <!-- BOSS BATTLE: UI do Jogador (Postes de vida) -->
    <div id="player-hp-container">
      <img
        src="/assets/img/Pole-turned-on.png"
        class="poste-vida"
        id="poste-1"
        style="position: absolute; width: 3vw; height: 6vw"
      />
      <img
        src="/assets/img/Pole-turned-on.png"
        class="poste-vida"
        id="poste-2"
        style="position: absolute; width: 3vw; height: 6vw"
      />
      <img
        src="/assets/img/Pole-turned-on.png"
        class="poste-vida"
        id="poste-3"
        style="position: absolute; width: 3vw; height: 6vw"
      />
      <img
        src="/assets/img/Pole-turned-on.png"
        class="poste-vida"
        id="poste-4"
        style="position: absolute; width: 3vw; height: 6vw"
      />
      <img
        src="/assets/img/Pole-turned-on.png"
        class="poste-vida"
        id="poste-5"
        style="position: absolute; width: 3vw; height: 6vw"
      />
      <img
        src="/assets/img/Pole-turned-on.png"
        class="poste-vida"
        id="poste-6"
        style="position: absolute; width: 3vw; height: 6vw"
      />
      <img
        src="/assets/img/Pole-turned-on.png"
        class="poste-vida"
        id="poste-7"
        style="position: absolute; width: 3vw; height: 6vw"
      />
      <img
        src="/assets/img/Pole-turned-on.png"
        class="poste-vida"
        id="poste-8"
        style="position: absolute; width: 3vw; height: 6vw"
      />
    </div>

    <!-- Mensagem de Fase -->
    <div id="game-message"></div>

    <!-- BOSS ARENA -->
    <div id="boss-arena">
      <img
        src="/assets/img/Villain.png"
        id="boss-body"
        alt="Boss Body"
        draggable="false"
      />

      <!-- Olhos do Boss (Fase 2) -->
      <div class="container mapa" id="boss-eyes-container">
        <div class="layer bottom"></div>
        <div class="layer top">
          <div class="eye-glow"></div>
        </div>
      </div>
      <div class="cast-bar-container" id="cast-eyes">
        <div class="cast-bar-fill"></div>
      </div>
      <div class="cast-bar-container" id="regen-eyes">
        <div class="cast-bar-fill"></div>
      </div>

      <!-- Mão Esquerda -->
      <div class="hand-wrapper left-hand" id="wrapper-left">
        <div class="cast-bar-container">
          <div class="cast-bar-fill" id="fill-left"></div>
        </div>

        <div class="boss-hand-target" id="hand-left">
          <img
            src="/assets/img/Villain-hand-left.png"
            class="hand-img"
            draggable="false"
          />
        </div>

        <div class="container mapa cuff-target" id="cuff-left">
          <div class="layer bottom"></div>
          <div class="layer top">
            <img
              src="/assets/img/Villain-fairycuffs-left.png"
              class="cuff-img"
              draggable="false"
            />
          </div>
        </div>
      </div>

      <!-- Mão Direita -->
      <div class="hand-wrapper right-hand" id="wrapper-right">
        <div class="cast-bar-container">
          <div class="cast-bar-fill" id="fill-right"></div>
        </div>

        <div class="boss-hand-target" id="hand-right">
          <img
            src="/assets/img/Villain-hand-right.png"
            class="hand-img"
            draggable="false"
          />
        </div>

        <div class="container mapa cuff-target" id="cuff-right">
          <div class="layer bottom"></div>
          <div class="layer top">
            <img
              src="/assets/img/Villain-fairycuffs-right.png"
              class="cuff-img"
              draggable="false"
            />
          </div>
        </div>
      </div>
    </div>

    <script src="/core/caixa_dialogo/falas.js"></script>
    <script src="/core/caixa_dialogo/script.js"></script>
    <script src="/core/sound/script.js"></script>
    <script src="script.js"></script>
  </body>
</html>
