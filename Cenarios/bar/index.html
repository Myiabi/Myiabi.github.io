<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/core/global.css">
    <link rel="stylesheet" href="/core/popup/style.css">
    <script src="https://unpkg.com/interactjs/dist/interact.min.js"></script>
    <link rel="stylesheet" href="/core/menu_interativo/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <div id="scene">
    
<div class="btnback" id="btn-back" data-destino="/city.html">↩</div>    

<img class="food" id="cake1" src="/assets/img/Food-cake.png" draggable="false">
<img class="food" id="cake2" src="/assets/img/Food-cake.png" draggable="false">


<!--     <img src="/assets/img/NPC_Snake-Capella.png" id="cobra5">
 -->    
  <div id="game1" class="modal-overlay hidden">

    <div class="modal-box">
      <h1>Mesa 1</h1>

      <div class="items-area">
        <div class="draggable itemA" data-game="1" data-required="true">   <img src="/assets/img/Food-cake.png"> </div>
        <div class="draggable itemA" data-game="1" data-required="true"> <img src="/assets/img/Food-coke.png"> </div>
        <div class="draggable itemA" data-game="1" data-required="true"> <img src="/assets/img/Food-hamburger.png"> </div>
        <div class="draggable itemA" data-game="1"> <img src="/assets/img/Food-fries.png">  </div>
      </div>

      <div class="container">
        <div class="dropzone interact" data-type="A" data-game="1"> <img src="/assets/img/Corner-table.png">  </div>
      </div>

        <div class="close-x" data-close="game1">✕</div>
    </div>

  </div>


  <div id="game2" class="modal-overlay hidden">

    <div class="modal-box">
      <h1>Mesa 2</h1>

      <div class="items-area">

        <div class="draggable itemA" data-game="2" data-required="true">A</div>
        <div class="draggable itemB" data-game="2" data-required="true">B</div>

        <div class="draggable itemC" data-game="2"></div>
        <div class="draggable itemC" data-game="2"></div>

      </div>

      <div class="container">
        <div class="dropzone interact" data-type="A" data-game="2"><img src="/assets/img/Corner-table.png"></div>
        <div class="dropzone interact" data-type="B" data-game="2"><img src="/assets/img/Corner-table.png"></div>
        <div class="dropzone interact" data-type="C" data-game="2"><img src="/assets/img/Corner-table.png"></div>
      </div>

        <div class="close-x" data-close="game2">✕</div>
    </div>

  </div>


  <div id="game3" class="modal-overlay hidden">
    <div class="modal-box">
      <h1>Mesa 3</h1>

      <div class="items-area">

        <div class="draggable itemA" data-game="3" data-required="true">A</div>

        <div class="draggable itemD" data-game="3">D</div>
        <div class="draggable itemD" data-game="3">D</div>

      </div>

      <div class="container">
        <div class="dropzone interact" data-type="A" data-game="3"><img src="/assets/img/Corner-table.png"></div>
        <div class="dropzone interact" data-type="D" data-game="3"><img src="/assets/img/Corner-table.png"></div>
      </div>

        <div class="close-x" data-close="game3">✕</div>
    </div>
  </div>


  <div id="game4" class="modal-overlay hidden">
    <div class="modal-box">
      <h1>Mesa 4</h1>

      <div class="items-area">

        <div class="draggable itemA" data-game="4" data-required="true"><img src="/assets/img/Food-friedchicken.png"></div>
        <div class="draggable itemB" data-game="4" data-required="true">B</div>
        <div class="draggable itemC" data-game="4" data-required="true">C</div>
        <div class="draggable itemD" data-game="4" data-required="true">D</div>

      </div>

      <div class="container">
        <div class="dropzone interact" data-type="A" data-game="4"><img src="/assets/img/Corner-table.png"></div>
        <div class="dropzone interact" data-type="B" data-game="4"><img src="/assets/img/Corner-table.png"></div>
        <div class="dropzone interact" data-type="C" data-game="4"><img src="/assets/img/Corner-table.png"></div>
        <div class="dropzone interact" data-type="D" data-game="4"><img src="/assets/img/Corner-table.png"></div>
      </div>

          <div class="close-x" data-close="game4">✕</div>
    </div>
  </div>



  <img id="bg" src="/assets/img/BG_Bar.png" alt="BG" draggable="false">
  <img id="counter" src="/assets/img/counter.png" draggable="false">
  <img class="npc" id="barman" src="/assets/img/NPC_Barman.png" draggable="false">
  <img class="npc" id="assistant" src="/assets/img/NPC_Assistent.png" draggable="false"> 

  <img class="table open-btn" data-modal="game1" id="table1" src="/assets/img/table1.png" draggable="false">
  <button id="glass"></button>
  
  <img class="table open-btn" data-modal="game2" id="table2" src="/assets/img/table2.png" draggable="false">
  <button id="girlfriend"></button>
  <button id="boyfriend"></button>

  <img class="table open-btn" data-modal="game4" id="table4" src="/assets/img/table4.png" draggable="false">
    <button id="gorro"></button>
    <button id="moreno"></button>
    <button id="rosinha"></button>

  <img class="table open-btn" data-modal="game3" id="table3" src="/assets/img/table3.png" draggable="false">
    <button id="cachecol"></button>
    <button id="kid1"></button>
    <button id="kid2"></button>
    <button id="verdinha"></button>


  
</div>


<script src="/loader.js"></script>    
</body>
</html>
