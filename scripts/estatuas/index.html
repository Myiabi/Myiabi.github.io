<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sequência Correta</title>
<link rel="stylesheet" href="style.css">

</head>
<body>

<button onclick="openModal()">Abrir Minigame Sequência</button>

<!-- MODAL -->
<div id="modalSequencia" class="modal-overlay">

  <div class="modal-box">

    <span class="close-btn" onclick="closeModal()">×</span>

    <h3>Arraste e troque até ficar na ordem 1 → 2 → 3 → 4</h3>

    <div class="container" id="container">
      <div class="item" draggable="true" data-value="3">3</div>
      <div class="item" draggable="true" data-value="1">1</div>
      <div class="item" draggable="true" data-value="4">4</div>
      <div class="item" draggable="true" data-value="2">2</div>
      <div class="item" draggable="true" data-value="5">5</div>
    </div>

  </div>
</div>

<script src="/loader.js"></script>

</body>
</html>
