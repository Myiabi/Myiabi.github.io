<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Minigame Drag & Drop</title>

  <script src="https://unpkg.com/interactjs/dist/interact.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- BOTÕES -->
  <button class="open-btn" data-modal="game1">Abrir Mesa 1</button>
  <button class="open-btn" data-modal="game2">Abrir Mesa 2</button>
  <button class="open-btn" data-modal="game3">Abrir Mesa 3</button>
  <button class="open-btn" data-modal="game4">Abrir Mesa 4</button>


  <!-- ===================== MODAL 1 ===================== -->
  <div id="game1" class="modal-overlay hidden">

    <div class="modal-box">
      <h1>Mesa 1</h1>

      <div class="items-area">
        <div class="draggable itemA" data-game="1">A</div>
        <div class="draggable itemA" data-game="1">A</div>
        <div class="draggable itemB" data-game="1">B</div>
        <div class="draggable itemB" data-game="1">B</div>
      </div>

      <div class="container">
        <div class="dropzone interact" data-type="A" data-game="1">Zona A</div>
        <div class="dropzone interact" data-type="B" data-game="1">Zona B</div>
      </div>

      <button class="close-btn" data-close="game1">Fechar</button>
    </div>

  </div>


  <!-- ===================== MODAL 2 ===================== -->
  <div id="game2" class="modal-overlay hidden">

    <div class="modal-box">
      <h1>Mesa 2</h1>

      <div class="items-area">
        <div class="draggable itemA" data-game="2">A</div>
        <div class="draggable itemB" data-game="2">B</div>
        <div class="draggable itemC" data-game="2">C</div>
        <div class="draggable itemC" data-game="2">C</div>
      </div>

      <div class="container">
        <div class="dropzone interact" data-type="A" data-game="2">A</div>
        <div class="dropzone interact" data-type="B" data-game="2">B</div>
        <div class="dropzone interact" data-type="C" data-game="2">C</div>
      </div>

      <button class="close-btn" data-close="game2">Fechar</button>
    </div>

  </div>


  <!-- ===================== MODAL 3 ===================== -->
  <div id="game3" class="modal-overlay hidden">
    <div class="modal-box">
      <h1>Mesa 3</h1>

      <div class="items-area">
        <div class="draggable itemA" data-game="3">A</div>
        <div class="draggable itemD" data-game="3">D</div>
        <div class="draggable itemD" data-game="3">D</div>
      </div>

      <div class="container">
        <div class="dropzone interact" data-type="A" data-game="3">A</div>
        <div class="dropzone interact" data-type="D" data-game="3">D</div>
      </div>

      <button class="close-btn" data-close="game3">Fechar</button>
    </div>
  </div>


  <!-- ===================== MODAL 4 ===================== -->
  <div id="game4" class="modal-overlay hidden">
    <div class="modal-box">
      <h1>Mesa 4</h1>

      <div class="items-area">
        <div class="draggable itemA" data-game="4">A</div>
        <div class="draggable itemB" data-game="4">B</div>
        <div class="draggable itemC" data-game="4">C</div>
        <div class="draggable itemD" data-game="4">D</div>
      </div>

      <div class="container">
        <div class="dropzone interact" data-type="A" data-game="4">A</div>
        <div class="dropzone interact" data-type="B" data-game="4">B</div>
        <div class="dropzone interact" data-type="C" data-game="4">C</div>
        <div class="dropzone interact" data-type="D" data-game="4">D</div>
      </div>

      <button class="close-btn" data-close="game4">Fechar</button>
    </div>
  </div>


  <script src="script.js"></script>
</body>
</html>
