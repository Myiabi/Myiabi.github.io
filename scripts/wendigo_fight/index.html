<!-- File: index.html -->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Minigame — Boss Teleport (Dark HUD)</title>
  <link rel="stylesheet" href="/core//global.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="game">
    <!-- Boss bar (top, estilo Dark Souls) -->
    <div id="boss-bar-wrap">
      <div id="boss-name">CHEFE</div>
      <div id="boss-bar">
        <div id="boss-bar-fill"></div>
      </div>
    </div>

    <div id="arena">
      <svg id="trails" width="100%" height="100%"></svg>
      <div id="enemies"></div>

      <!-- overlay container (messages) -->
      <div id="overlay-container"></div>

      <!-- particle container for circle hits -->
      <div id="particles"></div>
    </div>

    <!-- Player HUD bottom -->
    <div id="player-hud">
      <div id="hearts"></div>
      <button id="restart">Reiniciar</button>
    </div>
  </div>

  <script src="/loader.js"></script>
</body>
</html>
