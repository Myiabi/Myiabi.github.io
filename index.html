    <style>
      /* --- SEU RESET CSS (Melhoria para mobile) --- */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-drag: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        touch-action: none;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        font-family: "Arial", sans-serif;
        color: white;
        touch-action: none;
      }

      /* --- CONTEÚDO DO JOGO (CENA 2) --- */
      #game-content {
        position: relative;
        width: 100vw;
        height: 100dvh; /* dvh = dynamic viewport height - funciona com barra de endereço mobile */
        overflow: hidden;
        opacity: 0;
      }

      #game-content.animate-entrance {
        animation: gameContentReveal 2s ease forwards;
      }

      /* --- BACKGROUND DO JOGO (Estica 100%) --- */
      #bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: fill; /* Estica para preencher */
        z-index: 0;
      }

      /* --- NPCs --- */
      .npc {
        height: 28%;
        position: absolute;
        z-index: 1;
      }

      #nanai {
        width: 10%;
        top: 50%;
        left: 25%;
      }
      #nodatai {
        width: 9.5%;
        top: 50%;
        left: 62%;
      }
      #aikoi {
        position: absolute;
        width: 10%;
        top: 65%;
        left: 45%;
      }

      /* --- TELA DE INÍCIO --- */
      #start-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
        transition: opacity 0.5s ease;
      }

      .start-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
      }

      #start-btn {
        position: relative;
        z-index: 10;
        padding: 15px 50px;
        font-size: 1.5rem;
        color: white;
        background: transparent;
        border: 2px solid rgba(255, 255, 255, 0.5);
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 4px;
        font-family: "Georgia", serif;
        transition: all 0.3s ease;
        backdrop-filter: blur(5px);
      }

      #start-btn:hover {
        background: white;
        color: black;
        border-color: white;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
      }

      /* --- INTRO OVERLAY --- */
      #game-intro {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100dvh;
        z-index: 100;
        display: none;
        justify-content: center;
        align-items: center;
        background: black;
        pointer-events: auto;
      }

      /* --- ELEMENTOS DA INTRO (Atualizado para IMG tag) --- */
      .intro-bg-1 {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* AQUI ESTÁ A MUDANÇA: Usamos object-fit fill igual ao jogo */
        object-fit: fill;
        z-index: 1;
        transform: scale(2.5); /* Começa com zoom */
      }

      .cinematic-bar {
        position: absolute;
        left: 0;
        width: 100%;
        height: 12vh;
        background: black;
        z-index: 20;
        transition: transform 0.8s ease-out;
      }
      .bar-top {
        top: 0;
        transform: translateY(-100%);
      }
      .bar-bottom {
        bottom: 0;
        transform: translateY(100%);
      }

      .game-title {
        position: relative;
        z-index: 30;
        font-family: "Georgia", serif;
        font-size: clamp(2.5rem, 6vw, 5rem);
        letter-spacing: 6px;
        color: #f0f0f0;
        text-transform: uppercase;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 1);
        opacity: 0;
        will-change: transform, opacity;
      }

      .intro-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        z-index: 10;
        opacity: 0;
      }

      /* --- GATILHOS DE ANIMAÇÃO --- */
      #game-intro.running .intro-bg-1 {
        animation: fullRevealZoom 7s ease-out forwards;
      }
      #game-intro.running .bar-top {
        animation: slideDown 0.8s ease-out forwards;
      }
      #game-intro.running .bar-bottom {
        animation: slideUp 0.8s ease-out forwards;
      }
      #game-intro.running .game-title {
        animation: titleReveal 3s ease-out 2.5s forwards;
      }
      #game-intro.running .intro-overlay {
        animation: fadeInOverlay 2s ease 1s forwards;
      }

      /* --- KEYFRAMES --- */
      @keyframes fullRevealZoom {
        0% {
          transform: scale(2.5);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes titleReveal {
        0% {
          opacity: 0;
          transform: translateY(20px);
          filter: blur(10px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0px);
        }
      }
      @keyframes gameContentReveal {
        to {
          opacity: 1;
        }
      }
      @keyframes fadeInOverlay {
        to {
          opacity: 1;
        }
      }
      @keyframes slideDown {
        from {
          transform: translateY(-100%);
        }
        to {
          transform: translateY(0);
        }
      }
      @keyframes slideUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }
      @keyframes fadeOutIntro {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      .replay-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 200;
        padding: 8px 16px;
        background: transparent;
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.3);
        cursor: pointer;
        font-family: monospace;
        opacity: 0.5;
        transition: opacity 0.3s;
      }
      .replay-btn:hover {
        opacity: 1;
      }

      /* --- VERSÃO DO JOGO --- */
      #game-version {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 200;
        color: rgba(255, 255, 255, 0.6);
        font-family: monospace;
        font-size: 0.85rem;
        line-height: 1.4;
        text-align: left;
      }

      #game-version .version-number {
        color: rgba(255, 255, 255, 0.8);
        font-weight: bold;
      }

      #game-version .version-info {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.75rem;
      }
    </style>

    <button class="replay-btn" onclick="replayIntro()" style="display: none">

    <script>
      // ========== SISTEMA DE PASSE ÚNICO ==========
      // Intro é tela inicial - só bloqueia se já foi completada
      (function () {
        if (localStorage.getItem("intro_completo") === "true") {
          window.location.replace("/city.html");
          return;
        }
      })();

      // --- SEU SCRIPT PURO ---
      async function cenaIntro() {
        await dialogo.abrirAsync({ nome: "", texto: "..." });
        await dialogo.abrirAsync(personagens.aiko, "intro");
        await esperar(300);
        await dialogo.abrirAsync(personagens.nana, "intro");
        await esperar(300);
        await dialogo.abrirAsync(personagens.nodata, "intro");
        await esperar(300);
        await dialogo.abrirAsync(personagens.aiko, "intro2");
        await esperar(300);
        await dialogo.abrirAsync(personagens.nana, "intro2");
        await esperar(300);
        await dialogo.abrirAsync(personagens.nodata, "intro2");
        await esperar(300);
        await dialogo.abrirAsync(personagens.aiko, "intro3");

        console.log("Cena finalizada!");

        // A TATUAGEM ETERNA: Marca que a intro já foi completada
        localStorage.setItem("intro_completo", "true");

        // Usa replace para não permitir voltar com botão back
        window.location.replace("/cenarios/templo/index.html");
      }

      // --- LÓGICA DE CONTROLE DA INTRO ---
      let scriptTimeoutId = null;

      function startIntroSequence() {
        const intro = document.getElementById("game-intro");
        const gameContent = document.getElementById("game-content");

        if (intro) {
          intro.style.display = "flex";
          intro.style.animation = "none";
          intro.style.opacity = "1";
          intro.style.visibility = "visible";

          void intro.offsetWidth;

          intro.classList.add("running");

          if (gameContent) {
            gameContent.style.pointerEvents = "none";
          }

          // --- TIMER 1: Sumir com a intro ---
          setTimeout(() => {
            intro.style.animation = "fadeOutIntro 1.5s forwards";

            if (gameContent) {
              gameContent.classList.add("animate-entrance");
            }

            setTimeout(() => {
              intro.classList.remove("running");
              if (intro.parentNode) intro.parentNode.removeChild(intro);
              if (gameContent) {
                gameContent.style.pointerEvents = "";
              }
            }, 1500);
          }, 7500);

          // --- TIMER 2: Rodar o script ---
          scriptTimeoutId = setTimeout(() => {
            console.log("⏱️ Timer disparou: Chamando cenaIntro agora...");
            cenaIntro();
          }, 10500);
        }
      }

      // --- INICIALIZAÇÃO ---
      document.addEventListener("DOMContentLoaded", () => {
        const startBtn = document.getElementById("start-btn");
        const startScreen = document.getElementById("start-screen");

        startBtn.addEventListener("click", () => {
          startScreen.style.opacity = "0";
          setTimeout(() => {
            startScreen.style.display = "none";
            startIntroSequence();
          }, 500);
        });
      });

      function replayIntro() {
        if (scriptTimeoutId) clearTimeout(scriptTimeoutId);

        const gameContent = document.getElementById("game-content");
        if (gameContent) {
          gameContent.classList.remove("animate-entrance");
          gameContent.style.opacity = "0";
        }

        const oldIntro = document.getElementById("game-intro");
        if (oldIntro) oldIntro.remove();

        const introHTML = `
                <div id="game-intro">
                    <img src="/assets/img/BG_Base.png" class="intro-bg-1" alt="Intro Background">
                    <div class="intro-overlay"></div>
                    <div class="cinematic-bar bar-top"></div>
                    <div class="cinematic-bar bar-bottom"></div>
                    <h1 class="game-title">COLD MEMORIES</h1>
                </div>
            `;
        document.body.insertAdjacentHTML("beforeend", introHTML);
        startIntroSequence();
      }
    </script>

    <script src="/loader.js"></script>

    <!-- Registro do Service Worker para PWA com feedback visual -->
    <script>
      // Sistema de feedback de download do PWA
      const PWADownloader = {
        failedUrls: [],
        downloadApproved: false,

        // Cria modal de confirmação
        createConfirmDialog() {
          if (document.getElementById("pwa-confirm-dialog")) return;

          const dialog = document.createElement("div");
          dialog.id = "pwa-confirm-dialog";
          dialog.innerHTML = `
            <style>
              #pwa-confirm-dialog {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.7);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 99998;
                font-family: Arial, sans-serif;
              }
              #pwa-confirm-content {
                background: rgba(0, 0, 0, 0.95);
                border: 2px solid #4a90d9;
                border-radius: 12px;
                padding: 20px;
                max-width: 400px;
                color: white;
              }
              #pwa-confirm-title {
                font-size: 18px;
                font-weight: bold;
                margin-bottom: 10px;
              }
              #pwa-confirm-message {
                font-size: 14px;
                color: #ccc;
                margin-bottom: 20px;
                line-height: 1.5;
              }
              #pwa-confirm-buttons {
                display: flex;
                gap: 10px;
              }
              #pwa-accept-btn {
                flex: 1;
                background: #4a90d9;
                border: none;
                color: white;
                padding: 10px 16px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                font-weight: bold;
              }
              #pwa-accept-btn:hover {
                background: #3a7bc8;
              }
              #pwa-decline-btn {
                flex: 1;
                background: #666;
                border: none;
                color: white;
                padding: 10px 16px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
              }
              #pwa-decline-btn:hover {
                background: #555;
              }
            </style>
            <div id="pwa-confirm-content">
              <div id="pwa-confirm-title">📱 Download Game Files?</div>
              <div id="pwa-confirm-message">
                This will download ~50MB of game files to play offline without an internet connection. You can cancel anytime.
              </div>
              <div id="pwa-confirm-buttons">
                <button id="pwa-accept-btn">✓ Download</button>
                <button id="pwa-decline-btn">✕ Cancel</button>
              </div>
            </div>
          `;
          document.body.appendChild(dialog);

          document.getElementById("pwa-accept-btn").onclick = () => {
            dialog.remove();
            this.downloadApproved = true;
            this.createStatusOverlay();
            navigator.serviceWorker.controller?.postMessage({
              type: "START_CACHE",
            });
          };

          document.getElementById("pwa-decline-btn").onclick = () => {
            dialog.remove();
          };
        },

        // Cria o overlay de status
        createStatusOverlay() {
          if (document.getElementById("pwa-status-overlay")) return;

          const overlay = document.createElement("div");
          overlay.id = "pwa-status-overlay";
          overlay.innerHTML = `
            <style>
              #pwa-status-overlay {
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: rgba(0, 0, 0, 0.9);
                border: 2px solid #4a90d9;
                border-radius: 12px;
                padding: 15px 20px;
                color: white;
                font-family: Arial, sans-serif;
                font-size: 14px;
                z-index: 99999;
                max-width: 320px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.5);
              }
              #pwa-status-overlay.error {
                border-color: #ff4444;
              }
              #pwa-status-overlay.success {
                border-color: #44ff44;
              }
              #pwa-status-title {
                font-weight: bold;
                margin-bottom: 8px;
                display: flex;
                align-items: center;
                gap: 8px;
              }
              #pwa-status-message {
                color: #ccc;
                margin-bottom: 10px;
              }
              #pwa-retry-btn {
                background: #4a90d9;
                border: none;
                color: white;
                padding: 8px 16px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                margin-right: 8px;
              }
              #pwa-retry-btn:hover {
                background: #3a7bc8;
              }
              #pwa-close-btn {
                background: #666;
                border: none;
                color: white;
                padding: 8px 16px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
              }
              #pwa-spinner {
                display: inline-block;
                width: 16px;
                height: 16px;
                border: 2px solid #fff;
                border-top-color: transparent;
                border-radius: 50%;
                animation: pwa-spin 1s linear infinite;
              }
              @keyframes pwa-spin {
                to { transform: rotate(360deg); }
              }
            </style>
            <div id="pwa-status-title">
              <div id="pwa-spinner"></div>
              <span id="pwa-title-text">Setting up offline game...</span>
            </div>
            <div id="pwa-status-message">Downloading files to play without internet</div>
            <div id="pwa-buttons" style="display: none;">
              <button id="pwa-retry-btn">🔄 Retry</button>
              <button id="pwa-close-btn">✕ Close</button>
            </div>
          `;
          document.body.appendChild(overlay);

          document.getElementById("pwa-close-btn").onclick = () =>
            overlay.remove();
          document.getElementById("pwa-retry-btn").onclick = () =>
            this.retryDownload();
        },

        // Atualiza status
        updateStatus(title, message, type = "loading") {
          const overlay = document.getElementById("pwa-status-overlay");
          if (!overlay) return;

          const spinner = document.getElementById("pwa-spinner");
          const titleText = document.getElementById("pwa-title-text");
          const messageEl = document.getElementById("pwa-status-message");
          const buttons = document.getElementById("pwa-buttons");

          overlay.className = "";

          if (type === "success") {
            overlay.classList.add("success");
            spinner.style.display = "none";
            titleText.textContent = "✅ " + title;
            buttons.style.display = "none";
            // Auto-fecha após 5 segundos
            setTimeout(() => overlay.remove(), 5000);
          } else if (type === "error") {
            overlay.classList.add("error");
            spinner.style.display = "none";
            titleText.textContent = "❌ " + title;
            buttons.style.display = "block";
          } else {
            spinner.style.display = "inline-block";
            titleText.textContent = title;
            buttons.style.display = "none";
          }

          messageEl.textContent = message;
        },

        // Retry download
        retryDownload() {
          if (this.failedUrls.length === 0) return;

          this.updateStatus(
            "Recovering files...",
            `Trying to download ${this.failedUrls.length} file(s)`,
            "loading"
          );

          navigator.serviceWorker.controller?.postMessage({
            type: "RETRY_FAILED",
            urls: this.failedUrls,
          });
        },

        // Verifica integridade do cache
        verifyCache() {
          navigator.serviceWorker.controller?.postMessage({
            type: "VERIFY_CACHE",
          });
        },
      };

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/service-worker.js")
            .then((registration) => {
              console.log(
                "Service Worker registered successfully:",
                registration.scope
              );

              // Shows confirmation dialog if installing
              if (registration.installing) {
                PWADownloader.createConfirmDialog();
              }
            })
            .catch((error) => {
              console.log("Failed to register Service Worker:", error);
            });

          // Escuta mensagens do Service Worker
          navigator.serviceWorker.addEventListener("message", (event) => {
            const data = event.data;

            switch (data.type) {
              case "CACHE_COMPLETE":
                PWADownloader.createStatusOverlay();
                PWADownloader.updateStatus(
                  "Download complete!",
                  `${data.cached}/${data.total} files ready to play offline`,
                  "success"
                );
                break;

              case "CACHE_FAILED":
                PWADownloader.failedUrls = data.failedUrls;
                PWADownloader.createStatusOverlay();
                PWADownloader.updateStatus(
                  "Some files failed",
                  `${data.cached}/${data.total} downloaded. ${data.failedUrls.length} failed. Click to retry.`,
                  "error"
                );
                break;

              case "CACHE_ERROR":
                PWADownloader.createStatusOverlay();
                PWADownloader.updateStatus(
                  "Download error",
                  `Error: ${data.error}. Check your connection and try again.`,
                  "error"
                );
                break;

              case "RETRY_SUCCESS":
                PWADownloader.failedUrls = [];
                PWADownloader.updateStatus(
                  "Recovery complete!",
                  "All files have been downloaded successfully!",
                  "success"
                );
                break;

              case "RETRY_PARTIAL":
                PWADownloader.failedUrls = data.failedUrls;
                PWADownloader.updateStatus(
                  "Partial recovery",
                  `${data.recovered} recovered, ${data.failedUrls.length} still failing.`,
                  "error"
                );
                break;

              case "VERIFY_RESULT":
                if (data.complete) {
                  console.log("✅ Cache intact! All files present.");
                } else {
                  console.warn(
                    `⚠️ Cache incomplete! Missing ${data.missingUrls.length} files.`
                  );
                  PWADownloader.failedUrls = data.missingUrls;
                }
                break;

              case "CACHE_INCOMPLETE_ON_ACTIVATE":
                console.warn(
                  `⚠️ Incomplete cache detected (${data.missingCount}/${data.totalExpected}). Attempting to recover...`
                );
                PWADownloader.createStatusOverlay();
                PWADownloader.updateStatus(
                  "Checking cache...",
                  `${data.totalExpected - data.missingCount}/${
                    data.totalExpected
                  } files ready. Looking for missing ones...`,
                  "loading"
                );
                break;

              case "AUTO_RECOVERY_COMPLETE":
                if (data.failed === 0) {
                  PWADownloader.updateStatus(
                    "✅ Everything recovered!",
                    `${data.recovered} files have been downloaded successfully!`,
                    "success"
                  );
                } else {
                  PWADownloader.failedUrls = []; // Limpa lista
                  PWADownloader.createStatusOverlay();
                  PWADownloader.updateStatus(
                    "Partial recovery",
                    `${data.recovered} recovered, ${data.failed} still failing. Click to retry.`,
                    "error"
                  );
                }
                break;
            }
          });
        });
      }
    </script>
  </body>
</html>
