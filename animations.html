<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emoções e Ações com Emojis e CSS</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #eef2ff, #c7d2fe);
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;

      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 2vh;
      padding: 2vh;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      width: 15vw;
      min-width: 90px;
      height: 20vh;
      padding: 2vh 1vw;

      border-radius: 1vw;
      background: white;
      box-shadow: 0 0.8vh 2vh rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.2s;
    }
    .card:hover { transform: scale(1.05); }

    .character {
      font-size: 6vh;
      margin-bottom: 0.5vh;
      display: inline-block;
    }

    h2 {
      font-size: 1.6vh;
      color: #374151;
      margin: 0.5vh 0 0;
    }

    /* ANIMAÇÕES */
    @keyframes breathe { 0%,100%{transform:scale(1);} 50%{transform:scale(1.1);} }
    @keyframes scared { 0%,100%{transform:translate(0,0);} 25%{transform:translate(-2px,2px);} 50%{transform:translate(2px,-1px);} 75%{transform:translate(-1px,-2px);} }
    @keyframes cold { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-3px);} 75%{transform:translateX(3px);} }
    @keyframes jump { 0%,100%{transform:translateY(0);} 40%{transform:translateY(-5vh);} 60%{transform:translateY(-2vh);} }
    @keyframes recoil { 0%{transform:translateX(0)rotate(0);} 50%{transform:translateX(-1vw)rotate(-5deg);} 100%{transform:translateX(0)rotate(0);} }
    @keyframes wind { 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(4deg);} }
    @keyframes walk { 0%,100%{transform:translateX(0);} 50%{transform:translateX(2vw);} }
    @keyframes run { 0%,100%{transform:translateX(0);} 25%{transform:translateX(4vw);} 75%{transform:translateX(-4vw);} }
    @keyframes think { 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(-10deg);} }
    @keyframes laugh { 0%,100%{transform:scale(1);} 25%{transform:scale(1.15)rotate(3deg);} 75%{transform:scale(1.1)rotate(-3deg);} }
    @keyframes angry { 0%,100%{transform:rotate(0deg)scale(1);} 25%{transform:rotate(3deg)scale(1.1);} 75%{transform:rotate(-3deg)scale(1.1);} }
    @keyframes sleep { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-1vh);} }
    @keyframes love { 0%,100%{transform:scale(1);} 50%{transform:scale(1.3);} }
    @keyframes cry { 0%,100%{transform:translateY(0);} 50%{transform:translateY(1vh);} }
    @keyframes question { 0%{opacity:0;transform:translateY(-1vh)rotate(-15deg);} 50%{opacity:1;transform:translateY(0.5vh)rotate(5deg);} 100%{opacity:0.8;} }
    @keyframes exclamation { 0%{transform:scale(0)rotate(-30deg);opacity:0;} 40%{transform:scale(1.3)rotate(10deg);opacity:1;} 100%{transform:scale(1)rotate(0);} }
    @keyframes funny { 0%,100%{transform:translateY(0);} 25%{transform:translateY(-0.5vh)rotate(5deg);} 75%{transform:translateY(-0.3vh)rotate(-5deg);} }

    .breathe  { animation: breathe 2s ease-in-out infinite; }
    .scared   { animation: scared 0.1s infinite; }
    .cold     { animation: cold 0.08s linear infinite; }
    .jump     { animation: jump 0.7s cubic-bezier(.28,.84,.42,1) infinite; }
    .recoil   { animation: recoil 0.5s ease-out infinite; }
    .wind     { animation: wind 3s ease-in-out infinite; }
    .walk     { animation: walk 1.8s ease-in-out infinite alternate; }
    .run      { animation: run 0.6s linear infinite alternate; }
    .think    { animation: think 1.4s ease-in-out infinite; }
    .laugh    { animation: laugh 0.8s ease-in-out infinite; }
    .angry    { animation: angry 0.25s ease-in-out infinite; }
    .sleep    { animation: sleep 2.5s ease-in-out infinite; }
    .love     { animation: love 1.2s ease-in-out infinite; }
    .cry      { animation: cry 0.8s ease-in-out infinite; }
    .question { animation: question 2s ease-in-out infinite; }
    .exclaim  { animation: exclamation 1.5s cubic-bezier(.36,.07,.19,.97) infinite; }
    .funny    { animation: funny 0.5s ease-in-out infinite; }

    @media (orientation: portrait) {
      body {
        transform: rotate(-90deg) translateX(-100vh);
        transform-origin: top left;
        width: 100vh;
        height: 100vw;
        overflow: hidden;
      }
    }
  </style>
</head>
<body>

  <div class="card"><div class="character breathe">💤</div><h2>Respirando</h2></div>
  <div class="card"><div class="character scared">😱</div><h2>Com medo</h2></div>
  <div class="card"><div class="character cold">🥶</div><h2>Com frio</h2></div>
  <div class="card"><div class="character jump">🤸</div><h2>Pulando</h2></div>
  <div class="card"><div class="character recoil">😨</div><h2>Assustado</h2></div>
  <div class="card"><div class="character wind">🌬️</div><h2>Com vento</h2></div>
  <div class="card"><div class="character walk">🚶</div><h2>Andando</h2></div>
  <div class="card"><div class="character run">🏃</div><h2>Correndo</h2></div>
  <div class="card"><div class="character think">🤔</div><h2>Pensando</h2></div>
  <div class="card"><div class="character laugh">😂</div><h2>Rindo</h2></div>
  <div class="card"><div class="character angry">😡</div><h2>Bravo</h2></div>
  <div class="card"><div class="character sleep">😴</div><h2>Dormindo</h2></div>
  <div class="card"><div class="character love">😍</div><h2>Apaixonado</h2></div>
  <div class="card"><div class="character cry">😭</div><h2>Chorando</h2></div>
  <div class="card"><div class="character question">❓</div><h2>Interrogação</h2></div>
  <div class="card"><div class="character exclaim">❗</div><h2>Exclamação</h2></div>
  <div class="card"><div class="character funny">😂</div><h2>Risada intensa</h2></div>

</body>
</html>
